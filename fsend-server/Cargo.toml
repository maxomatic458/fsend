[package]
name = "fsend-server"
description = "The fsend server: pairs peers and counts the bytes they transfer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
fsend-proto.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
clap.workspace = true
getrandom = "0.4.3"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite.workspace = true
