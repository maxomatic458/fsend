[package]
name = "fsend-core"
description = "Pairing, connections and transfers for fsend clients"
version = "0.1.0"
rust-version = "1.91"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fsend-proto.workspace = true
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
iroh = "1.4.1"
rtc = "0.21.1"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "fs", "sync", "io-util"] }
tokio-stream = "0.1.19"
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing.workspace = true
url = "2.5.8"
webrtc = "0.21.1"

[dev-dependencies]
fsend-relay = { path = "../fsend-relay" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread"] }

# `cargo bench`: throughput over iroh and WebRTC, see benches/throughput.rs
[[bench]]
name = "throughput"
harness = false
