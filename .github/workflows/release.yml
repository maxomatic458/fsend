name: Release CLI

on:
  release:
    types: [published]
  # Lets a failed or partial release be re-run without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets to"
        required: true

concurrency:
  group: release-cli-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# Read-only by default; the jobs that publish assets opt into contents: write
# individually, so a compromised build step cannot rewrite the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # Fails fast if the crate version and the release tag disagree, so a
  # mislabelled binary never reaches the release page.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Check Cargo.toml version matches the tag
        run: |
          version=$(grep -m1 '^version = ' fsend-cli/Cargo.toml | cut -d'"' -f2)
          tag="${TAG#cli-}"
          tag="${tag#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::fsend-cli version is $version but the release tag is $TAG (normalised to $tag)"
            exit 1
          fi
          echo "fsend-cli $version matches tag $TAG"

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked, so these run on any distro regardless of libc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          # Dynamically linked against the runner's glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      # Pinned by commit: `stable` is a branch and can move without notice.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # Upload artifacts
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: fsend
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          manifest-path: fsend-cli/Cargo.toml
          archive: fsend-$target
          leading-dir: true
          locked: true
          ref: refs/tags/${{ env.TAG }}
          include: README.md,fsend-cli/LICENCE,fsend-cli/dist/completions,fsend-cli/dist/man
          token: ${{ secrets.GITHUB_TOKEN }}

  deb:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      # Pinned by commit: `stable` is a branch and can move without notice.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cross,cargo-deb

      # first build with cross, then build .deb with cargo-deb
      - name: Build binary
        working-directory: fsend-cli
        run: cross build --release --locked --target ${{ matrix.target }}

      # The binary is already stripped via cargo.toml
      - name: Build .deb
        working-directory: fsend-cli
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Upload to release
        working-directory: fsend-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd target/debian
          deb=$(ls -- *_"$ARCH".deb)
          gh release upload "$TAG" "$deb" --clobber
