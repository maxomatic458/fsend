name: Verify install instructions

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which install method to verify"
        type: choice
        default: all
        options:
          - all
          - apt
          - linux-x86_64
          - linux-aarch64
          - macos-aarch64
          - macos-x86_64
          - windows-x86_64
          - source

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          SELECTED: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          # Scenarios run on hardware matching the architecture they install.
          # macos-13 (the old free Intel image) has been retired, so Intel
          # macOS is only available as the -intel/-large SKU.
          all='[
            {"runner":"ubuntu-latest","ids":"apt linux-x86_64 source"},
            {"runner":"ubuntu-24.04-arm","ids":"linux-aarch64"},
            {"runner":"macos-latest","ids":"macos-aarch64"},
            {"runner":"macos-15-intel","ids":"macos-x86_64"},
            {"runner":"windows-latest","ids":"windows-x86_64"}
          ]'
          if [ "$SELECTED" = "all" ]; then
            matrix=$(jq -c . <<<"$all")
          else
            # Keep only the runner that owns the chosen scenario, narrowed to
            # that one scenario.
            matrix=$(jq -c --arg id "$SELECTED" \
              '[.[] | select(.ids | split(" ") | index($id)) | .ids = $id]' <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "verifying: $matrix"

  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.ids }}
    defaults:
      run:
        working-directory: fsend-site/install

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the `source` scenario needs a toolchain
      - if: contains(matrix.ids, 'source')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # unix: check install, uninstalls
      - name: Verify
        if: runner.os != 'Windows'
        shell: bash
        env:
          IDS: ${{ matrix.ids }}
        run: |
          set -uo pipefail
          failed=""
          for id in $IDS; do
            echo "::group::$id"
            # The install script runs piped, as the site shows it; apt and cargo have their own commands.
            case $id in
              apt | source) install="bash -e $id.install.sh"; uninstall="bash -e $id.uninstall.sh" ;;
              *) install="sh -s < ../public/install.sh"; uninstall="sh -s -- --uninstall < ../public/install.sh" ;;
            esac
            if bash -c "$install" \
              && bash -c 'set -e; command -v fsend; fsend version; fsend --help >/dev/null' \
              && bash -c "$uninstall" \
              && bash -c 'if command -v fsend; then exit 1; fi'
            then
              echo "$id: ok"
            else
              echo "::error::$id: install/uninstall verification failed"
              failed="$failed $id"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
          echo "all scenarios passed:$IDS"

      # windows
      - name: Verify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content ../public/install.ps1 -Raw
          # As the site shows them: piped into iex, and with -Uninstall.
          $script | Invoke-Expression

          $exe = "$env:LOCALAPPDATA\Programs\fsend\fsend.exe"
          if (-not (Test-Path $exe)) { throw "fsend.exe not found at $exe" }
          fsend version
          fsend --help | Out-Null

          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*fsend*") { throw "install did not add fsend to the user PATH" }

          Invoke-Expression "& {$script} -Uninstall"

          if (Test-Path $exe) { throw "$exe still exists after uninstall" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*fsend*") { throw "uninstall left fsend on the user PATH" }
          if (Get-Command fsend -ErrorAction SilentlyContinue) { throw "fsend is still on this session's PATH" }
          Write-Host "windows-x86_64: ok"
