[package]
name = "fsend-proto"
description = "Protocol types shared by the fsend CLI, relay and web app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# TypeScript bindings for the types the web app sees
ts = ["dep:ts-rs"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
spake2 = "0.4.0"
thiserror.workspace = true
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }
zstd = { version = "0.14.4", default-features = false }
