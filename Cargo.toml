[workspace]
resolver = "3"
members = ["fsend-cli", "fsend-proto", "fsend-proto-wasm", "fsend-relay"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Maxomatic458"]
repository = "https://github.com/maxomatic458/fsend"
homepage = "https://fsend.sh"

[workspace.dependencies]
fsend-proto = { path = "fsend-proto", version = "0.1.0" }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tokio = "1.52.1"
tokio-tungstenite = "0.30"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = false
