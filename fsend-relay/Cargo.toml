[package]
name = "fsend-relay"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Maxomatic458"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
