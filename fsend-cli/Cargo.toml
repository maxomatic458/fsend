[package]
name = "fsend-cli"
description = "A CLI for fsend, a peer-to-peer file sharing tool"
keywords = ["file-transfer", "peer-to-peer", "p2p", "cli"]
version = "0.3.0"
rust-version = "1.91"
readme = "../README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fsend-proto.workspace = true
async-compression = { version = "0.4.44", features = ["tokio", "gzip"] }
async-trait = "0.1.92"
bytes = "1.12"
clap.workspace = true
color-eyre = "0.6.5"
colored = "3.1"
dialoguer = "0.12"
futures-util = "0.3.34"
indicatif = "0.18"
iroh = "1.1"
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "net", "fs", "sync", "io-util"] }
tokio-stream = "0.1"
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webrtc = "0.20"

[dev-dependencies]
fsend-relay = { path = "../fsend-relay" }
tempfile = "3.27"

# Used by `cargo deb` in the release workflow
[package.metadata.deb]
name = "fsend"
# dont track deb revision
revision = ""
maintainer = "Maxomatic458"
copyright = "Maxomatic458"
license-file = ["LICENCE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
fsend is a peer-to-peer file transfer tool. Send files and directories, \
no relay server involved. Transfers can be resumed if interrupted. \
Compatible with the fsend.sh web-app. \
"""

assets = [
    ["target/release/fsend", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/fsend/README.md", "644"],
    ["dist/man/*.1", "usr/share/man/man1/", "644"],
    ["dist/completions/fsend.bash", "usr/share/bash-completion/completions/fsend", "644"],
    ["dist/completions/fsend.fish", "usr/share/fish/vendor_completions.d/fsend.fish", "644"],
    ["dist/completions/_fsend", "usr/share/zsh/vendor-completions/_fsend", "644"],
]

[build-dependencies]
clap.workspace = true
clap_complete = "4.6"
clap_mangen = "0.3"
tracing.workspace = true

[[bin]]
name = "fsend"
path = "src/main.rs"

# `cargo bench`: CLI <-> CLI throughput over iroh and WebRTC, see benches/throughput.rs
[[bench]]
name = "throughput"
harness = false