[package]
name = "fsend-cli"
license = "MIT"
description = "A CLI for fsend, a peer-to-peer file sharing tool"
authors = ["Maxomatic458"]
keywords = ["file-transfer", "peer-to-peer", "p2p", "cli"]
version = "0.2.1"
edition = "2021"
rust-version = "1.91"
repository = "https://github.com/maxomatic458/fsend"
homepage = "https://fsend.sh"
readme = "../README.md"

[dependencies]
async-compression = { version = "0.4.44", features = ["tokio", "gzip"] }
async-trait = "0.1.92"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6.5"
colored = "3.1"
dialoguer = "0.12"
futures-util = "0.3.34"
indicatif = "0.18"
iroh = "1.1"
rkyv = "0.8.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "time", "macros", "net", "fs", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webrtc = "0.20"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Used by `cargo deb` in the release workflow
[package.metadata.deb]
name = "fsend"
# dont track deb revision
revision = ""
maintainer = "Maxomatic458"
copyright = "Maxomatic458"
license-file = ["LICENCE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
fsend is a peer-to-peer file transfer tool. Send files and directories, \
no relay server involved. Transfers can be resumed if interrupted. \
Compatible with the fsend.sh web-app. \
"""

assets = [
    ["target/release/fsend", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/fsend/README.md", "644"],
    ["dist/man/*.1", "usr/share/man/man1/", "644"],
    ["dist/completions/fsend.bash", "usr/share/bash-completion/completions/fsend", "644"],
    ["dist/completions/fsend.fish", "usr/share/fish/vendor_completions.d/fsend.fish", "644"],
    ["dist/completions/_fsend", "usr/share/zsh/vendor-completions/_fsend", "644"],
]

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
tracing = "0.1.44"

[[bin]]
name = "fsend"
path = "src/main.rs"

# `cargo bench`: CLI <-> CLI throughput over iroh and WebRTC, see benches/throughput.rs
[[bench]]
name = "throughput"
harness = false