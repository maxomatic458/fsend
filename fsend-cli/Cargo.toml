[package]
name = "fsend-cli"
description = "A CLI for fsend, a peer-to-peer file sharing tool"
keywords = ["file-transfer", "peer-to-peer", "p2p", "cli"]
version = "0.5.0"
rust-version = "1.91"
readme = "../README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fsend-core.workspace = true
fsend-proto = { workspace = true, features = ["clap"] }
clap.workspace = true
color-eyre = "0.6.5"
colored = "3.1.1"
dialoguer = "0.12.0"
dirs = "7.0.0"
indicatif = "0.18.6"
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "serde", "parse"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

# Used by `cargo deb` in the release workflow
[package.metadata.deb]
name = "fsend"
# dont track deb revision
revision = ""
maintainer = "Maxomatic458"
copyright = "Maxomatic458"
license-file = ["LICENCE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
fsend is a peer-to-peer file transfer tool. Send files and directories, \
no relay server involved. Transfers can be resumed if interrupted. \
Compatible with the fsend.sh web-app. \
"""

assets = [
    ["target/release/fsend", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/fsend/README.md", "644"],
    ["dist/man/*.1", "usr/share/man/man1/", "644"],
    ["dist/completions/fsend.bash", "usr/share/bash-completion/completions/fsend", "644"],
    ["dist/completions/fsend.fish", "usr/share/fish/vendor_completions.d/fsend.fish", "644"],
    ["dist/completions/_fsend", "usr/share/zsh/vendor-completions/_fsend", "644"],
]

[build-dependencies]
fsend-proto = { workspace = true, features = ["clap"] }
clap.workspace = true
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
tracing.workspace = true
url = "2.5.8"

[[bin]]
name = "fsend"
path = "src/main.rs"
