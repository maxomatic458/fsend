<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />

    <title>fsend — Free P2P File Transfer in Your Browser</title>
    <meta
      name="description"
      content="Send files of any size directly between devices, peer-to-peer over WebRTC. End-to-end encrypted, no uploads, no accounts, no size limits. Free and open source."
    />
    <meta
      name="keywords"
      content="p2p file transfer, webrtc file sharing, send files browser, end-to-end encrypted file transfer, no upload file share, free file sharing, peer to peer, fsend"
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://fsend.sh/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script defer="" data-domain="fsend.sh" src="https://analytics.fsend.sh/js/script.js"></script>

    <!-- Apply the stored theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#151515" : "#f7f5f2");
        } catch (e) {}
      })();
    </script>

    <link
      rel="preload"
      href="/fonts/source-sans-3-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fsend" />
    <meta
      property="og:title"
      content="fsend — Free P2P File Transfer in Your Browser"
    />
    <meta

    <meta property="og:url" content="https://fsend.sh/" />
    <meta property="og:image" content="https://fsend.sh/og-image.png" />

    <meta property="og:image:height" content="630" />
