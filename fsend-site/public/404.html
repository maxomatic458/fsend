<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — fsend</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f7f5f2;
        --ink: #1a1a1a;
        --ink-dim: #6b6b6b;
        --azure: #2f6fe0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #151515;
          --ink: #ededed;
          --ink-dim: #8a8a8a;
          --azure: #4d84ff;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 1.25rem;
      }
      h1 {
        margin: 0;
        font-size: 3rem;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        color: var(--ink-dim);
      }
      a {
        margin-top: 0.75rem;
        color: var(--azure);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>That page doesn't exist.</p>
    <a href="/">Back to fsend</a>
  </body>
</html>
