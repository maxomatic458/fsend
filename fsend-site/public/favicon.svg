<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="fsend">
  <title>fsend</title>
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6570f" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6570f"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d84ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4d84ff"/>
    </linearGradient>
  </defs>
  <!-- The mark fills the tile: scaled to 31 of 32 wide and centred vertically,
       so it stays legible at 16px. No backdrop — the gradient fades into
       whatever the browser's tab strip happens to be, same as on the site. -->
  <g transform="translate(0.5 8.21) scale(0.974)">
    <g transform="translate(5.824 0)">
      <g transform="skewX(-20)">
        <rect x="9" y="0" width="17" height="8" fill="url(#flame)"/>
        <rect x="0" y="8" width="26" height="8" fill="url(#azure)"/>
      </g>
    </g>
  </g>
</svg>
